<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Missas - Painel Administrativo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="theme-manager.js"></script>
</head>

<body>
    <!-- Verificar autenticação -->
    <script>
        if (localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'admin-login.html';
        }
    </script>

    <header class="admin-header">
        <div class="container">
            <div class="header-content">
                <div class="admin-logo">
                    <div class="admin-logo-icon">
                        <i class="fas fa-church"></i>
                    </div>
                    <div>
                        <div class="admin-logo-text">Painel Administrativo</div>
                        <div class="admin-logo-subtitle">Comunidade Mesa e Pão</div>
                    </div>
                </div>
                <div class="admin-nav">
                    <a href="index.html" class="admin-nav-btn" target="_blank">
                        <i class="fas fa-external-link-alt"></i> Ver Site
                    </a>
                    <button class="admin-nav-btn" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav>
                <ul class="sidebar-nav">
                    <li class="sidebar-item">
                        <a href="admin-dashboard.html" class="sidebar-link">
                            <i class="fas fa-tachometer-alt"></i> Painel de Controle
                        </a>
                    </li>
                    <div class="sidebar-divider"></div>
                    <li class="sidebar-item">
                        <a href="admin-missas.html" class="sidebar-link active">
                            <i class="fas fa-church"></i> Missas
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="admin-eventos.html" class="sidebar-link">
                            <i class="fas fa-calendar-alt"></i> Eventos
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="admin-retiros.html" class="sidebar-link">
                            <i class="fas fa-praying-hands"></i> Retiros
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="admin-enciclopedias.html" class="sidebar-link">
                            <i class="fas fa-book"></i> Biblioteca
                        </a>
                    </li>
                    <div class="sidebar-divider"></div>
                </ul>
            </nav>
        </aside>

        <main class="admin-content">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="fas fa-church"></i> Gerenciar Missas
                </h1>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" onclick="openMassModal('regular')">
                        <i class="fas fa-plus"></i> Nova Missa Regular
                    </button>
                    <button class="btn btn-secondary" onclick="openMassModal('special')">
                        <i class="fas fa-plus"></i> Missa Especial
                    </button>
                </div>
            </div>

            <!-- Tabs: apenas duas abas -->
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('regular', this)">
                    Horários Regulares
                </button>
                <button class="tab-btn" onclick="showTab('special', this)">
                    Missas Especiais
                </button>
            </div>

            <!-- Horários Regulares -->
            <div id="regular-tab" class="tab-content">
                <!-- Cada dia da semana terá uma seção -->
                <div class="mass-section">
                    <h3><i class="fas fa-sun"></i> Domingo</h3>
                    <div class="mass-times-list" id="masses-sunday"></div>
                    <button class="btn btn-outline" onclick="addMassTime('sunday')" style="margin-top: 15px;">
                        <i class="fas fa-plus"></i> Adicionar
                    </button>
                </div>

                <div class="mass-section">
                    <h3><i class="fas fa-calendar-day"></i> Segunda-feira</h3>
                    <div class="mass-times-list" id="masses-monday"></div>
                    <button class="btn btn-outline" onclick="addMassTime('monday')" style="margin-top: 15px;">
                        <i class="fas fa-plus"></i> Adicionar
                    </button>
                </div>

                <div class="mass-section">
                    <h3><i class="fas fa-calendar-day"></i> Terça-feira</h3>
                    <div class="mass-times-list" id="masses-tuesday"></div>
                    <button class="btn btn-outline" onclick="addMassTime('tuesday')" style="margin-top: 15px;">
                        <i class="fas fa-plus"></i> Adicionar
                    </button>
                </div>

                <div class="mass-section">
                    <h3><i class="fas fa-calendar-day"></i> Quarta-feira</h3>
                    <div class="mass-times-list" id="masses-wednesday"></div>
                    <button class="btn btn-outline" onclick="addMassTime('wednesday')" style="margin-top: 15px;">
                        <i class="fas fa-plus"></i> Adicionar
                    </button>
                </div>

                <div class="mass-section">
                    <h3><i class="fas fa-calendar-day"></i> Quinta-feira</h3>
                    <div class="mass-times-list" id="masses-thursday"></div>
                    <button class="btn btn-outline" onclick="addMassTime('thursday')" style="margin-top: 15px;">
                        <i class="fas fa-plus"></i> Adicionar
                    </button>
                </div>

                <div class="mass-section">
                    <h3><i class="fas fa-calendar-day"></i> Sexta-feira</h3>
                    <div class="mass-times-list" id="masses-friday"></div>
                    <button class="btn btn-outline" onclick="addMassTime('friday')" style="margin-top: 15px;">
                        <i class="fas fa-plus"></i> Adicionar
                    </button>
                </div>

                <div class="mass-section">
                    <h3><i class="fas fa-star"></i> Sábado</h3>
                    <div class="mass-times-list" id="masses-saturday"></div>
                    <button class="btn btn-outline" onclick="addMassTime('saturday')" style="margin-top: 15px;">
                        <i class="fas fa-plus"></i> Adicionar
                    </button>
                </div>
            </div>

            <!-- Missas Especiais -->
            <div id="special-tab" class="tab-content" style="display: none;">
                <div class="mass-section">
                    <h3><i class="fas fa-star"></i> Missas Especiais</h3>
                    <div class="special-masses-list" id="special-masses-list"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- Modal para Adicionar/Editar Missa -->
    <div class="modal" id="massModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Nova Missa</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="massForm">
                    <input type="hidden" id="massId">
                    <input type="hidden" id="massDay">

                    <!-- Dia da semana (para regulares) -->
                    <div class="form-group" id="regular-day-field">
                        <label for="massDaySelect">Dia da Semana</label>
                        <select id="massDaySelect" class="form-control">
                            <option value="sunday">Domingo</option>
                            <option value="monday">Segunda-feira</option>
                            <option value="tuesday">Terça-feira</option>
                            <option value="wednesday">Quarta-feira</option>
                            <option value="thursday">Quinta-feira</option>
                            <option value="friday">Sexta-feira</option>
                            <option value="saturday">Sábado</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="massTime">Horário</label>
                        <input type="time" id="massTime" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="massType">Tipo de Missa</label>
                        <input type="text" id="massType" class="form-control" placeholder="Ex: Missa Matinal, Missa da Família" required>
                    </div>

                    <div class="form-group" id="special-fields" style="display: none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="specialDate">Data</label>
                                <input type="date" id="specialDate" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="specialLocation">Local</label>
                                <input type="text" id="specialLocation" class="form-control" placeholder="Ex: Igreja Matriz">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="specialCelebrant">Celebrante</label>
                            <input type="text" id="specialCelebrant" class="form-control" placeholder="Ex: Pe. João Silva">
                        </div>
                        <div class="form-group">
                            <label for="specialDescription">Descrição</label>
                            <textarea id="specialDescription" class="form-control" rows="3" placeholder="Descrição da missa especial"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
                <button class="btn" onclick="saveMass()">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // API URL
        // ============================================
        const API_URL = 'http://localhost:5000/api/masses';

        let currentModalType = 'regular';
        let editingMassId = null;

        // ============================================
        // LOGOUT
        // ============================================
        function logout() {
            if (confirm('Tem certeza que deseja sair do painel administrativo?')) {
                localStorage.removeItem('adminLoggedIn');
                window.location.href = 'admin-login.html';
            }
        }

        // ============================================
        // TABS
        // ============================================
        function showTab(tabName, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.getElementById(`${tabName}-tab`).style.display = 'block';
        }

        // ============================================
        // CARREGAR MISSAS
        // ============================================
        async function loadMassData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro ao carregar missas');
                const masses = await response.json();

                // Lista de dias da semana
                const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
                const specials = masses.filter(m => m.day === 'special');

                // Renderizar cada dia
                days.forEach(day => {
                    const dayMasses = masses.filter(m => m.day === day);
                    renderMassList(day, dayMasses);
                });

                renderSpecialMasses(specials);

            } catch (error) {
                alert('Erro ao carregar missas: ' + error.message);
            }
        }

        function renderMassList(day, masses) {
            const list = document.getElementById(`masses-${day}`);
            if (!list) return;
            list.innerHTML = masses.map(mass => `
                <div class="mass-time-item">
                    <div class="mass-time-info">
                        <div class="mass-time-slot">${mass.time}</div>
                        <div class="mass-time-type">${mass.type}</div>
                    </div>
                    <div class="mass-time-actions">
                        <button class="btn btn-outline" onclick="editMass('${mass._id}')">
                            <i class="fas fa-edit"></i> Editar
                        </button>
                        <button class="btn btn-danger" onclick="deleteMass('${mass._id}')">
                            <i class="fas fa-trash"></i> Excluir
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderSpecialMasses(masses) {
            const list = document.getElementById('special-masses-list');
            if (!list) return;
            list.innerHTML = masses.map(mass => {
                const date = new Date(mass.date);
                const day = date.getDate();
                const month = date.toLocaleDateString('pt-BR', { month: 'short' }).toUpperCase();
                return `
                    <div class="special-mass-item">
                        <div class="special-mass-date">
                            <div class="special-mass-day">${day}</div>
                            <div class="special-mass-month">${month}</div>
                        </div>
                        <div class="special-mass-details">
                            <h4 style="margin: 0 0 5px 0; color: var(--primary);">${mass.type}</h4>
                            <p style="margin: 0 0 10px 0; color: var(--gray);">${mass.description || ''}</p>
                            <div class="special-mass-meta">
                                <span><i class="far fa-clock"></i> ${mass.time}</span>
                                <span><i class="fas fa-map-marker-alt"></i> ${mass.location || ''}</span>
                                <span><i class="fas fa-user-alt"></i> ${mass.celebrant || ''}</span>
                            </div>
                            <div class="special-mass-actions">
                                <button class="btn btn-outline" onclick="editMass('${mass._id}')">
                                    <i class="fas fa-edit"></i> Editar
                                </button>
                                <button class="btn btn-danger" onclick="deleteMass('${mass._id}')">
                                    <i class="fas fa-trash"></i> Excluir
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // MODAL
        // ============================================
        function openMassModal(type, day = null) {
            currentModalType = type;
            editingMassId = null;
            const modal = document.getElementById('massModal');
            const form = document.getElementById('massForm');
            const specialFields = document.getElementById('special-fields');
            const regularField = document.getElementById('regular-day-field');
            const modalTitle = document.getElementById('modalTitle');
            const daySelect = document.getElementById('massDaySelect');

            form.reset();

            if (type === 'regular') {
                modalTitle.textContent = day ? `Adicionar Missa - ${getDayName(day)}` : 'Nova Missa Regular';
                specialFields.style.display = 'none';
                regularField.style.display = 'block';
                // Se veio um dia específico, seleciona no select
                if (day) {
                    daySelect.value = day;
                } else {
                    daySelect.value = 'sunday'; // padrão
                }
                document.getElementById('massDay').value = '';
            } else {
                modalTitle.textContent = 'Nova Missa Especial';
                specialFields.style.display = 'block';
                regularField.style.display = 'none';
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('specialDate').min = today;
                document.getElementById('specialDate').value = today;
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('massModal').classList.remove('active');
        }

        function getDayName(day) {
            const days = {
                'sunday': 'Domingo',
                'monday': 'Segunda-feira',
                'tuesday': 'Terça-feira',
                'wednesday': 'Quarta-feira',
                'thursday': 'Quinta-feira',
                'friday': 'Sexta-feira',
                'saturday': 'Sábado'
            };
            return days[day] || '';
        }

        // ============================================
        // SALVAR MISSA
        // ============================================
        async function saveMass() {
            const massId = document.getElementById('massId').value;
            const massTime = document.getElementById('massTime').value;
            const massType = document.getElementById('massType').value;

            if (!massTime || !massType) {
                alert('Por favor, preencha todos os campos obrigatórios.');
                return;
            }

            let massData = { time: massTime, type: massType };

            if (currentModalType === 'regular') {
                const daySelect = document.getElementById('massDaySelect');
                const day = daySelect.value;
                if (!day) {
                    alert('Selecione um dia da semana.');
                    return;
                }
                massData.day = day;
            } else {
                const specialDate = document.getElementById('specialDate').value;
                const specialLocation = document.getElementById('specialLocation').value;
                const specialCelebrant = document.getElementById('specialCelebrant').value;
                const specialDescription = document.getElementById('specialDescription').value;

                if (!specialDate || !specialLocation || !specialCelebrant || !specialDescription) {
                    alert('Por favor, preencha todos os campos da missa especial.');
                    return;
                }
                massData.day = 'special';
                massData.date = specialDate;
                massData.location = specialLocation;
                massData.celebrant = specialCelebrant;
                massData.description = specialDescription;
            }

            try {
                let response;
                if (massId) {
                    response = await fetch(`${API_URL}/${massId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(massData)
                    });
                } else {
                    response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(massData)
                    });
                }

                if (!response.ok) throw new Error('Erro ao salvar missa');

                loadMassData();
                closeModal();
                alert('Missa salva com sucesso!');
            } catch (error) {
                alert('Erro: ' + error.message);
            }
        }

        // ============================================
        // EDITAR / EXCLUIR
        // ============================================
        async function editMass(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                if (!response.ok) throw new Error('Missa não encontrada');
                const mass = await response.json();

                editingMassId = id;
                document.getElementById('massId').value = id;
                document.getElementById('massTime').value = mass.time;
                document.getElementById('massType').value = mass.type;

                if (mass.day === 'special') {
                    currentModalType = 'special';
                    document.getElementById('modalTitle').textContent = 'Editar Missa Especial';
                    document.getElementById('special-fields').style.display = 'block';
                    document.getElementById('regular-day-field').style.display = 'none';
                    document.getElementById('specialDate').value = mass.date || '';
                    document.getElementById('specialLocation').value = mass.location || '';
                    document.getElementById('specialCelebrant').value = mass.celebrant || '';
                    document.getElementById('specialDescription').value = mass.description || '';
                } else {
                    currentModalType = 'regular';
                    document.getElementById('modalTitle').textContent = `Editar Missa - ${getDayName(mass.day)}`;
                    document.getElementById('special-fields').style.display = 'none';
                    document.getElementById('regular-day-field').style.display = 'block';
                    document.getElementById('massDaySelect').value = mass.day;
                    document.getElementById('massDay').value = mass.day;
                }

                document.getElementById('massModal').classList.add('active');
            } catch (error) {
                alert('Erro ao carregar missa: ' + error.message);
            }
        }

        async function deleteMass(id) {
            if (!confirm('Tem certeza que deseja excluir esta missa?')) return;
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Erro ao excluir missa');
                loadMassData();
                alert('Missa excluída com sucesso!');
            } catch (error) {
                alert('Erro: ' + error.message);
            }
        }

        function addMassTime(day) {
            openMassModal('regular', day);
        }

        // ============================================
        // INICIALIZAR
        // ============================================
        document.addEventListener('DOMContentLoaded', function () {
            loadMassData();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('specialDate').min = today;
        });
    </script>
</body>

</html>
