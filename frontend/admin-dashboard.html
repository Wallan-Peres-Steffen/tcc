<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Fé Tech</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="theme-manager.js"></script>
    <script src="js/config.js"></script> <!-- Certifique-se de que o config.js está sendo carregado -->
</head>

<body>
    <!-- VERIFICAÇÃO DE AUTENTICAÇÃO -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (localStorage.getItem('adminLoggedIn') !== 'true') {
                window.location.href = 'admin-login.html';
            }
        });
    </script>

    <header class="admin-header">
        <div class="container">
            <div class="header-content">
                <div class="admin-logo">
                    <div class="admin-logo-icon">
                        <i class="fas fa-tachometer-alt"></i>
                    </div>
                    <div>
                        <div class="admin-logo-text">Painel Administrativo</div>
                        <div class="admin-logo-subtitle">Fé Tech</div>
                    </div>
                </div>
                <div class="admin-nav">
                    <a href="index.html" class="admin-nav-btn" target="_blank">
                        <i class="fas fa-external-link-alt"></i> Ver Site
                    </a>
                    <button class="admin-nav-btn" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav>
                <ul class="sidebar-nav">
                    <li class="sidebar-item">
                        <a href="admin-dashboard.html" class="sidebar-link active">
                            <i class="fas fa-tachometer-alt"></i> Painel de Controle
                        </a>
                    </li>
                    <div class="sidebar-divider"></div>
                    <li class="sidebar-item">
                        <a href="admin-missas.html" class="sidebar-link">
                            <i class="fas fa-church"></i> Missas
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="admin-eventos.html" class="sidebar-link">
                            <i class="fas fa-calendar-alt"></i> Eventos
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="admin-retiros.html" class="sidebar-link">
                            <i class="fas fa-praying-hands"></i> Retiros
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="admin-enciclopedias.html" class="sidebar-link">
                            <i class="fas fa-book"></i> Biblioteca
                        </a>
                    </li>
                    <div class="sidebar-divider"></div>
                </ul>
            </nav>
        </aside>

        <main class="admin-content">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="fas fa-tachometer-alt"></i> Painel de Controle
                </h1>
                <div>
                    <span class="btn-secondary" style="padding: 8px 16px; border-radius: 20px;">
                        <i class="fas fa-user"></i> Admin
                    </span>
                </div>
            </div>

            <!-- Estatísticas -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon missas">
                        <i class="fas fa-church"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Missas</h3>
                        <div class="stat-number" id="count-missas">0</div>
                        <small>Horários cadastrados</small>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon eventos">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Eventos</h3>
                        <div class="stat-number" id="count-eventos">0</div>
                        <small>Próximos eventos</small>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon retiros">
                        <i class="fas fa-praying-hands"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Retiros</h3>
                        <div class="stat-number" id="count-retiros">0</div>
                        <small>Programados</small>
                    </div>
                </div>
            </div>

            <!-- Atividade Recente -->
            <div class="recent-activity">
                <h2><i class="fas fa-history"></i> Atividade Recente</h2>
                <ul class="activity-list" id="activity-list">
                    <!-- O JavaScript vai preencher isso automaticamente -->
                </ul>
            </div>

            <!-- Ações Rápidas -->
            <div class="quick-actions">
                <h3><i class="fas fa-lightbulb"></i> Ações Rápidas</h3>
                <div class="btn-group">
                    <a href="admin-missas.html" class="btn">
                        <i class="fas fa-plus"></i> Nova Missa
                    </a>
                    <a href="admin-eventos.html" class="btn btn-secondary">
                        <i class="fas fa-plus"></i> Novo Evento
                    </a>
                    <a href="admin-retiros.html" class="btn btn-outline">
                        <i class="fas fa-plus"></i> Novo Retiro
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script>
        function logout() {
            if (confirm('Tem certeza que deseja sair do painel administrativo?')) {
                localStorage.removeItem('adminLoggedIn');
                window.location.href = 'admin-login.html';
            }
        }

        // Atualizar sidebar ativa
        document.addEventListener('DOMContentLoaded', function () {
            const currentPage = window.location.pathname.split('/').pop();
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.classList.toggle('active', link.getAttribute('href') === currentPage);
            });
        });

        // ==========================================
        // SCRIPT PARA BUSCAR DADOS REAIS DO BACKEND
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            // Pega a URL base do config.js ou usa o fallback
            const API_URL = window.APP_CONFIG ? window.APP_CONFIG.API_URL : 'https://tcc-backend-26lv.onrender.com/api';

            try {
                // 1. Busca os dados de todas as rotas ao mesmo tempo
                const [resMasses, resEvents, resRetreats] = await Promise.all([
                    fetch(`${API_URL}/masses`),
                    fetch(`${API_URL}/events`),
                    fetch(`${API_URL}/retreats`)
                ]);

                const masses = await resMasses.json();
                const events = await resEvents.json();
                const retreats = await resRetreats.json();

                // 2. Atualiza os contadores na tela
                document.getElementById('count-missas').textContent = masses.length || 0;
                document.getElementById('count-eventos').textContent = events.length || 0;
                document.getElementById('count-retiros').textContent = retreats.length || 0;

                // 3. Junta todos os itens em uma única lista para criar o histórico
                const allItems = [
                    ...masses.map(m => ({ ...m, type: 'Missa', icon: 'fa-church' })),
                    ...events.map(e => ({ ...e, type: 'Evento', icon: 'fa-calendar-alt' })),
                    ...retreats.map(r => ({ ...r, type: 'Retiro', icon: 'fa-praying-hands' }))
                ];

                // 4. Ordena do mais recente para o mais antigo (usando updatedAt ou createdAt)
                allItems.sort((a, b) => {
                    const dateA = new Date(a.updatedAt || a.createdAt || 0);
                    const dateB = new Date(b.updatedAt || b.createdAt || 0);
                    return dateB - dateA;
                });

                // Pega apenas os 5 mais recentes
                const recentItems = allItems.slice(0, 5);

                // 5. Renderiza no HTML
                const activityContainer = document.getElementById('activity-list');
                
                if (activityContainer) {
                    activityContainer.innerHTML = ''; // Limpa o que estava lá

                    if (recentItems.length === 0) {
                        activityContainer.innerHTML = '<li style="text-align:center; color:#888; padding: 20px;">Nenhuma atividade recente.</li>';
                    } else {
                        recentItems.forEach(item => {
                            // Formata a data para o padrão brasileiro
                            const dateObj = new Date(item.updatedAt || item.createdAt);
                            const dateStr = dateObj.toLocaleDateString('pt-BR') + ' às ' + dateObj.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                            
                            const li = document.createElement('li');
                            li.className = 'activity-item'; 
                            
                            li.innerHTML = `
                                <div class="activity-icon">
                                    <i class="fas ${item.icon}"></i>
                                </div>
                                <div class="activity-content">
                                    <h4>${item.type} cadastrado</h4>
                                    <p>${item.title || item.type} foi adicionado ao sistema</p>
                                </div>
                                <div class="activity-time">${dateStr}</div>
                            `;
                            activityContainer.appendChild(li);
                        });
                    }
                }

            } catch (error) {
                console.error("Erro ao carregar o dashboard:", error);
                const activityContainer = document.getElementById('activity-list');
                if (activityContainer) {
                    activityContainer.innerHTML = '<li style="color:red; text-align:center; padding: 20px;">Erro ao conectar com o servidor. Verifique se o backend está rodando.</li>';
                }
            }
        });
    </script>
</body>

</html>
