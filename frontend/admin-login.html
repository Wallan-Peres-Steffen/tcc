<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - Comunidade Mesa e Pão</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="theme-manager.js"></script>
</head>

<body>
    <div class="login-container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Voltar para o Site
        </a>

        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-icon">
                    <i class="fas fa-church"></i>
                </div>
                <div>
                    <div class="login-logo-text">Comunidade Mesa e Pão</div>
                    <div class="login-logo-subtitle">Painel Administrativo</div>
                </div>
            </div>

            <h2 class="login-title">Acesso Restrito</h2>

            <div class="alert alert-error" id="errorAlert">
                <i class="fas fa-exclamation-circle"></i> Credenciais inválidas. Tente novamente.
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" class="form-control" placeholder="Digite seu usuário" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" class="form-control" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>

            <div class="login-footer">
                <p>Apenas pessoal autorizado. Em caso de problemas, entre em contato com o administrador.</p>
            </div>
        </div>
    </div>

    <script>
        // Se já estiver logado, redirecionar para dashboard
        document.addEventListener('DOMContentLoaded', function () {
            const isLoggedIn = localStorage.getItem('adminLoggedIn');

            if (isLoggedIn === 'true') {
                window.location.href = 'admin-dashboard.html';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Credenciais padrão (em um sistema real, isso seria verificado no servidor)
            const validUsername = 'admin';
            const validPassword = 'paroquia2025';

            if (username === validUsername && password === validPassword) {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin-dashboard.html';
            } else {
                document.getElementById('errorAlert').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('errorAlert').style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>

</html>
