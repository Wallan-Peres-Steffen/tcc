<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Eventos - Painel Administrativo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="theme-manager.js"></script>
</head>
<body>
    <!-- Verificar autenticação -->
    <script>
        if (localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'admin-login.html';
        }
    </script>

    <header class="admin-header">
        <div class="container">
            <div class="header-content">
                <div class="admin-logo">
                    <div class="admin-logo-icon">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <div>
                        <div class="admin-logo-text">Painel Administrativo</div>
                        <div class="admin-logo-subtitle">Comunidade Mesa e Pão</div>
                    </div>
                </div>
                <div class="admin-nav">
                    <a href="index.html" class="admin-nav-btn" target="_blank">
                        <i class="fas fa-external-link-alt"></i> Ver Site
                    </a>
                    <button class="admin-nav-btn" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav>
                <ul class="sidebar-nav">
                    <li class="sidebar-item">
                        <a href="admin-dashboard.html" class="sidebar-link">
                            <i class="fas fa-tachometer-alt"></i> Painel de Controle
                        </a>
                    </li>
                    <div class="sidebar-divider"></div>
                    <li class="sidebar-item">
                        <a href="admin-missas.html" class="sidebar-link">
                            <i class="fas fa-church"></i> Missas
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="admin-eventos.html" class="sidebar-link active">
                            <i class="fas fa-calendar-alt"></i> Eventos
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="admin-retiros.html" class="sidebar-link">
                            <i class="fas fa-praying-hands"></i> Retiros
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="admin-enciclopedias.html" class="sidebar-link">
                            <i class="fas fa-book"></i> Biblioteca
                        </a>
                    </li>
                    <div class="sidebar-divider"></div>
                </ul>
            </nav>
        </aside>

        <main class="admin-content">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="fas fa-calendar-alt"></i> Gerenciar Eventos
                </h1>
                <button class="btn" onclick="openEventModal()">
                    <i class="fas fa-plus"></i> Novo Evento
                </button>
            </div>

            <div class="filter-section">
                <div class="filter-group">
                    <label>Filtrar por Categoria</label>
                    <select class="form-control" id="filterCategory" onchange="loadEvents()">
                        <option value="all">Todas as Categorias</option>
                        <option value="missa">Missas</option>
                        <option value="formacao">Formações</option>
                        <option value="festa">Festas</option>
                        <option value="servico">Serviços</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Filtrar por Status</label>
                    <select class="form-control" id="filterStatus" onchange="loadEvents()">
                        <option value="all">Todos os Status</option>
                        <option value="published">Publicados</option>
                        <option value="draft">Rascunhos</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Ordenar por</label>
                    <select class="form-control" id="filterSort" onchange="loadEvents()">
                        <option value="date_asc">Data (Mais Próximo)</option>
                        <option value="date_desc">Data (Mais Distante)</option>
                        <option value="title_asc">Título (A-Z)</option>
                        <option value="title_desc">Título (Z-A)</option>
                    </select>
                </div>
                <button class="btn btn-outline" onclick="clearFilters()">
                    <i class="fas fa-times"></i> Limpar Filtros
                </button>
            </div>

            <div class="events-list" id="eventsList">
                <!-- Eventos serão carregados aqui -->
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-calendar-times"></i>
                <h3>Nenhum evento encontrado</h3>
                <p>Não há eventos que correspondam aos filtros selecionados. Tente ajustar os critérios de busca.</p>
                <button class="btn" onclick="clearFilters()">
                    <i class="fas fa-times"></i> Limpar Filtros
                </button>
            </div>
        </main>
    </div>

    <!-- Modal para Adicionar/Editar Evento -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Novo Evento</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="eventForm">
                    <input type="hidden" id="eventId">

                    <div class="form-group">
                        <label for="eventTitle">Título do Evento *</label>
                        <input type="text" id="eventTitle" class="form-control" placeholder="Ex: Festa de São Francisco" required>
                    </div>

                    <div class="form-group">
                        <label for="eventDescription">Descrição *</label>
                        <textarea id="eventDescription" class="form-control" rows="4" placeholder="Descreva o evento..." required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="eventDate">Data *</label>
                            <input type="date" id="eventDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="eventTime">Hora *</label>
                            <input type="time" id="eventTime" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="eventLocation">Local *</label>
                            <input type="text" id="eventLocation" class="form-control" placeholder="Ex: Igreja Matriz" required>
                        </div>
                        <div class="form-group">
                            <label for="eventCategory">Categoria *</label>
                            <select id="eventCategory" class="form-control" required>
                                <option value="">Selecione...</option>
                                <option value="missa">Missa</option>
                                <option value="formacao">Formação</option>
                                <option value="festa">Festa</option>
                                <option value="servico">Serviço</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="eventResponsible">Responsável</label>
                        <input type="text" id="eventResponsible" class="form-control" placeholder="Ex: Pe. João Silva">
                    </div>

                    <div class="form-group">
                        <label for="eventStatus">Status</label>
                        <select id="eventStatus" class="form-control">
                            <option value="published">Publicado</option>
                            <option value="draft">Rascunho</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="eventNotes">Notas Internas (opcional)</label>
                        <textarea id="eventNotes" class="form-control" rows="3" placeholder="Informações internas sobre o evento..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
                <button class="btn" onclick="saveEvent()">Salvar Evento</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // API CONFIG
        // ============================================
        const API_URL = 'http://localhost:5000/api/events';

        let editingEventId = null;

        // ============================================
        // CRUD OPERATIONS
        // ============================================

        // Carregar eventos da API
        async function loadEvents() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro ao carregar eventos');
                const events = await response.json();

                const eventsList = document.getElementById('eventsList');
                const emptyState = document.getElementById('emptyState');

                // Aplicar filtros (frontend)
                const categoryFilter = document.getElementById('filterCategory').value;
                const statusFilter = document.getElementById('filterStatus').value;
                const sortFilter = document.getElementById('filterSort').value;

                let filtered = [...events];

                if (categoryFilter !== 'all') {
                    filtered = filtered.filter(e => e.category === categoryFilter);
                }

                if (statusFilter !== 'all') {
                    filtered = filtered.filter(e => e.status === statusFilter);
                }

                // Ordenar
                filtered.sort((a, b) => {
                    const dateA = new Date(a.date + 'T' + a.time);
                    const dateB = new Date(b.date + 'T' + b.time);

                    switch (sortFilter) {
                        case 'date_asc': return dateA - dateB;
                        case 'date_desc': return dateB - dateA;
                        case 'title_asc': return a.title.localeCompare(b.title);
                        case 'title_desc': return b.title.localeCompare(a.title);
                        default: return dateA - dateB;
                    }
                });

                if (filtered.length === 0) {
                    eventsList.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }

                eventsList.style.display = 'grid';
                emptyState.style.display = 'none';

                const categoryNames = {
                    'missa': 'Missa',
                    'formacao': 'Formação',
                    'festa': 'Festa',
                    'servico': 'Serviço',
                    'outro': 'Outro'
                };

                const statusNames = {
                    'published': 'Publicado',
                    'draft': 'Rascunho'
                };

                eventsList.innerHTML = filtered.map(event => {
                    const date = new Date(event.date);
                    const day = date.getDate();
                    const month = date.toLocaleDateString('pt-BR', { month: 'short' }).toUpperCase();

                    return `
                        <div class="event-card">
                            <div class="event-date">
                                <div class="event-day">${day}</div>
                                <div class="event-month">${month}</div>
                            </div>
                            <div class="event-details">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                    <h3 class="event-title">${event.title}</h3>
                                    <span class="status-badge status-${event.status}">${statusNames[event.status]}</span>
                                </div>
                                <p class="event-description">${event.description}</p>
                                <div class="event-meta">
                                    <span><i class="far fa-clock"></i> ${event.time}</span>
                                    <span><i class="fas fa-map-marker-alt"></i> ${event.location}</span>
                                    ${event.responsible ? `<span><i class="fas fa-user-alt"></i> ${event.responsible}</span>` : ''}
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span class="event-tag ${event.category}">${categoryNames[event.category]}</span>
                                    <small style="color: var(--gray);">Criado em: ${new Date(event.createdAt).toLocaleDateString('pt-BR')}</small>
                                </div>
                                <div class="event-actions">
                                    <button class="btn btn-outline" onclick="editEvent('${event.id}')">
                                        <i class="fas fa-edit"></i> Editar
                                    </button>
                                    <button class="btn btn-outline" onclick="duplicateEvent('${event.id}')">
                                        <i class="fas fa-copy"></i> Duplicar
                                    </button>
                                    <button class="btn btn-danger" onclick="deleteEvent('${event.id}')">
                                        <i class="fas fa-trash"></i> Excluir
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao carregar eventos. Verifique se o servidor está rodando.');
            }
        }

        // Salvar evento (criar ou atualizar)
        async function saveEvent() {
            const form = document.getElementById('eventForm');
            const eventId = document.getElementById('eventId').value;
            const title = document.getElementById('eventTitle').value;
            const description = document.getElementById('eventDescription').value;
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const location = document.getElementById('eventLocation').value;
            const category = document.getElementById('eventCategory').value;
            const responsible = document.getElementById('eventResponsible').value;
            const status = document.getElementById('eventStatus').value;
            const notes = document.getElementById('eventNotes').value;

            // Validação
            if (!title || !description || !date || !time || !location || !category) {
                alert('Por favor, preencha todos os campos obrigatórios.');
                return;
            }

            const eventData = { title, description, date, time, location, category, responsible, status, notes };

            try {
                let response;
                if (eventId) {
                    // Atualizar
                    response = await fetch(`${API_URL}/${eventId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(eventData)
                    });
                } else {
                    // Criar
                    response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(eventData)
                    });
                }

                if (!response.ok) throw new Error('Erro ao salvar evento');

                const savedEvent = await response.json();
                console.log('Evento salvo:', savedEvent);

                closeModal();
                loadEvents();
                alert('Evento salvo com sucesso!');

            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao salvar evento. Verifique o servidor.');
            }
        }

        // Editar evento
        async function editEvent(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                if (!response.ok) throw new Error('Erro ao buscar evento');
                const event = await response.json();

                editingEventId = id;
                document.getElementById('eventId').value = id;
                document.getElementById('modalTitle').textContent = 'Editar Evento';
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventDescription').value = event.description;
                document.getElementById('eventDate').value = event.date;
                document.getElementById('eventTime').value = event.time;
                document.getElementById('eventLocation').value = event.location;
                document.getElementById('eventCategory').value = event.category;
                document.getElementById('eventResponsible').value = event.responsible || '';
                document.getElementById('eventStatus').value = event.status;
                document.getElementById('eventNotes').value = event.notes || '';

                document.getElementById('eventModal').classList.add('active');

            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao carregar evento para edição.');
            }
        }

        // Duplicar evento
        async function duplicateEvent(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                if (!response.ok) throw new Error('Erro ao buscar evento');
                const original = await response.json();

                // Remover campos que não devem ser copiados
                delete original._id;
                delete original.id;
                delete original.createdAt;
                original.title = `Cópia - ${original.title}`;
                original.status = 'draft';

                const createResponse = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(original)
                });

                if (!createResponse.ok) throw new Error('Erro ao duplicar evento');

                loadEvents();
                alert('Evento duplicado com sucesso!');

            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao duplicar evento.');
            }
        }

        // Excluir evento
        async function deleteEvent(id) {
            if (!confirm('Tem certeza que deseja excluir este evento? Esta ação não pode ser desfeita.')) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Erro ao excluir evento');

                loadEvents();
                alert('Evento excluído com sucesso!');

            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao excluir evento.');
            }
        }

        // ============================================
        // UI CONTROLS
        // ============================================

        function openEventModal() {
            editingEventId = null;
            document.getElementById('eventId').value = '';
            document.getElementById('eventForm').reset();
            document.getElementById('modalTitle').textContent = 'Novo Evento';

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('eventDate').min = today;
            document.getElementById('eventDate').value = today;
            document.getElementById('eventTime').value = '19:00';

            document.getElementById('eventModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        function clearFilters() {
            document.getElementById('filterCategory').value = 'all';
            document.getElementById('filterStatus').value = 'all';
            document.getElementById('filterSort').value = 'date_asc';
            loadEvents();
        }

        function logout() {
            if (confirm('Tem certeza que deseja sair do painel administrativo?')) {
                localStorage.removeItem('adminLoggedIn');
                window.location.href = 'admin-login.html';
            }
        }

        // ============================================
        // INIT
        // ============================================

        document.addEventListener('DOMContentLoaded', function () {
            loadEvents();
            // Fechar modal ao clicar fora
            document.getElementById('eventModal').addEventListener('click', function (e) {
                if (e.target === this) closeModal();
            });
        });
    </script>
</body>
</html>
